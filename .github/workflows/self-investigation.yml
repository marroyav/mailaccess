name: MailAccess self-investigation

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install MailAccess
        run: python -m pip install --upgrade mailaccess greenlet

      - name: Investigate
        env:
          TARGET_EMAIL: ${{ secrets.MAILACCESS_TARGET_EMAIL }}
        run: |
          test -n "$TARGET_EMAIL" || { echo "MAILACCESS_TARGET_EMAIL secret is not configured"; exit 1; }
          mkdir -p report
          mailaccess investigate "$TARGET_EMAIL" -o report/mailaccess-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mailaccess-report
          path: report/mailaccess-report.json
          retention-days: 1
          if-no-files-found: error
