name: MailAccess self-investigation

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email address you own and are authorized to investigate"
        required: true
        type: string

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install MailAccess
        run: python -m pip install --upgrade mailaccess

      - name: Investigate
        env:
          TARGET_EMAIL: ${{ inputs.email }}
        run: |
          mkdir -p report
          mailaccess investigate "$TARGET_EMAIL" -o report/mailaccess-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mailaccess-report
          path: report/mailaccess-report.json
          retention-days: 1
          if-no-files-found: error
